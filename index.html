html,body{margin:0;padding:0}

p{margin:0 0 16px}
ul,ol{margin:0 0 18px;padding-left:1.4em}
li{margin-bottom:7px}
strong{font-weight:700}
a{color:var(--k);text-decoration:none;border-bottom:1px solid var(--k-45)}

footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--k-12);font-size:12px;color:var(--k-45);line-height:1.9}
